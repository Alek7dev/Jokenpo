<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles.css">
    <title>Welcome to Jokenpo </title>
</head>

<body>

    <div class="container">
      <h1>Jo-ken-pô!</h1>
       
        <div class="buttons">
            <button id="rock" onclick="playHuman('rock')">&#x270A;&#x1F3FF;</button>
            <button id="paper" onclick="playHuman('paper')">&#x1F590;&#x1F3FE;</button>
            <button id="scissors" onclick="playHuman('scissors')">&#x270C;&#x1F3FF; </button>
        </div>
        <p class="result"></p>
        <p class="your-score">Sua pontuação: <span id="humanScore">0</span></p>
        <p class="machine-score">Pontuação do Robô: <span id="machineScore">0</span></p>
        


    </div>
    <script src="scripts.js"></script>
</body>

</html>
